html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.55 Figtree,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 18px 56px}
h1{font:700 clamp(26px,5vw,38px)/1.1 Fraunces,Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 14px;font-size:16px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:8px}
nav button{flex:0 0 auto;min-height:48px;font:600 16px Figtree,sans-serif;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:0 18px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
#wk button{border-radius:10px}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--tom);outline-offset:2px}
h2{font:700 28px/1.2 Fraunces,Georgia,serif;margin:10px 0 14px}
section.m{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px;display:grid;grid-template-columns:116px 1fr;gap:16px;align-items:start}
.pic svg{width:116px;height:116px;display:block}
.pic{background:var(--tintp);border-radius:16px;padding:0}
@media (max-width:520px){section.m{grid-template-columns:1fr}.pic{justify-self:center}}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
h3{font:600 21px Fraunces,Georgia,serif;margin:0}
label.done{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mute);min-height:44px}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--acc)}
ul{margin:8px 0;padding-left:22px}
li{margin:3px 0}
details{margin-top:8px}
summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;color:var(--acc)}
details p{margin:0 0 6px}
.alt{background:var(--alt);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:16px}
.alt b{display:block;margin-bottom:2px}
.olio{color:var(--tom);font-weight:600;font-size:15px;margin:6px 0 0}
.note{color:var(--mute);font-size:16px}
</style>

var CN=["Varia il più possibile i cibi durante la settimana.","Cotture semplici: griglia, vapore, cartoccio, microonde. Pomodoro fresco una volta a settimana come condimento, “scoglio” o prodotti ittici, verdure in abbondanza per il primo.","Sale con moderazione: insaporisci con limone, aceto balsamico e di mele, salsa di pomodoro, spezie ed erbe aromatiche. Evita maionese e salse untuose.","Acqua: 1,5–2 litri al giorno. Evita bibite zuccherate come cola, succhi di frutta, aperitivi, tè freddo e alcolici. Concesse bevande light e zero, tè e tisane senza zuccheri.","Stile di vita attivo, seguendo le indicazioni del medico. Obiettivo: 150–160 minuti di attività aerobica continua (passeggiata) a settimana.","Non introdurre: snack salati, dolciumi, frutta secca oleosa e atipica (cocco, avocado), canditi, burro, panna, mascarpone, maionese, cioccolato, pasta sfoglia, strutto. Evita insaccati (mortadella, finocchiona, salame, salsiccia), pancetta e lardo.","Mangia con calma, a tavola, a televisore spento, meglio in compagnia."];
var fl=true,cd="",wk=0,last=new Date().toDateString(),wkEl=document.getElementById("wk"),nav=document.getElementById("nav"),v=document.getElementById("v");
function st(k,g){try{if(g===undefined)return localStorage.getItem("pa:"+k)==="1";localStorage.setItem("pa:"+k,g?"1":"0")}catch(e){return false}}
function li(a){return "<ul>"+a.map(function(x){return "<li>"+x+"</li>"}).join("")+"</ul>"}
function show(w,id){
var di=DAYS.map(function(d){return d[0]}).indexOf(id);
if(di<0&&id!=="sostituzioni"&&id!=="consigli"){id=DAYS[(new Date().getDay()+6)%7][0];di=DAYS.map(function(d){return d[0]}).indexOf(id)}
wk=w;cd=id;
wkEl.innerHTML=[0,1,2,3].map(function(n){return '<button data-w="'+n+'" aria-pressed="'+(n===w)+'">Settimana '+(n+1)+'</button>'}).join("");
nav.innerHTML='<button data-k="oggi" aria-pressed="'+fl+'">Oggi</button>'+DAYS.concat([["sostituzioni","Sostituzioni"],["consigli","Consigli"]]).map(function(t){return '<button data-k="'+t[0]+'" aria-pressed="'+(t[0]===id)+'">'+t[1]+'</button>'}).join("");
var h="";
if(di>=0){h="<h2>"+DAYS[di][1]+" · settimana "+(w+1)+(w===cur()&&di===(new Date().getDay()+6)%7?" · oggi":"")+"</h2>";mk(w,di).forEach(function(m,j){var key=(nw()-cur()+w)+DAYS[di][0]+j;
h+='<section class="m"><div class="pic">'+ill(w,di,j)+'</div><div class="mb"><div class="hd"><h3>'+m.t+'</h3><label class="done"><input type="checkbox" data-s="'+key+'"'+(st(key)?" checked":"")+'> Fatto</label></div>'+li(m.c);
if(m.we)h+='<div class="alt"><b>Alternativa</b>'+m.we+'</div>';
if(m.r)h+='<details><summary>Come si prepara</summary><p>'+m.r+'</p></details>';
if(m.o)h+='<p class="olio">Olio: '+m.o+'</p>';
if(m.a)h+='<div class="alt"><b>Alternative</b>'+m.a+'</div>';
h+="</div></section>"});
h+='<p class="note">Olio totale della giornata: 5 cucchiaini da tè per cucinare e condire.</p>'}
else h=id==="sostituzioni"?"<h2>Sostituzioni</h2>"+li(SO):"<h2>Consigli utili</h2>"+li(CN);
v.innerHTML=h;
document.getElementById("dt").textContent=new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+" · settimana "+(cur()+1)+" di 4"}
var START=new Date(2026,10,9);
function nw(){var t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.floor(Math.round((t-START)/864e5)/7)}
function cur(){return((nw()%4)+4)%4}
function tid(){return DAYS[(new Date().getDay()+6)%7][0]}
function go(){fl=true;show(cur(),tid())}
wkEl.onclick=function(e){var b=e.target.closest("button");if(b){fl=false;show(+b.dataset.w,cd)}};
nav.onclick=function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.k==="oggi")go();else{fl=false;show(wk,b.dataset.k)}};
v.onchange=function(e){if(e.target.dataset.s)st(e.target.dataset.s,e.target.checked)};
function tick(){var k=new Date().toDateString();if(k!==last){last=k;if(fl)go();else show(wk,cd)}}
setInterval(tick,60000);document.addEventListener("visibilitychange",tick);
go();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
